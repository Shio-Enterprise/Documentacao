<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Documentação - Plataforma Shio</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Documentação técnica da Plataforma Shio: E-commerce + Comunidade">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <link href="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/sidebar.min.css" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="assets/logo.png">

  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-darklight-theme@3.2.0/dist/style.min.css" title="docsify-darklight-theme" type="text/css">

  <style>
    /* ── Variáveis ─────────────────────────────────────────── */
    /* Cores claro/escuro vêm do plugin docsify-darklight-theme (window.$docsify.darklightTheme) */
    :root {
      --color-bg:       var(--pageBackground, #f5f5f5);
      --color-surface:  var(--background, #ffffff);
      --color-sidebar:  #2d2d2d;
      --color-border:   var(--tableBorder, #e0e0e0);
      --color-text:     var(--textColor, #1a1a1a);
      --color-muted:    var(--mutedColor, #666666);
      --color-accent:   var(--accent, #000000);
      --color-code-bg:  var(--codeBackgroundColor, #efefef);
      --color-stripe:   var(--stripeColor, #f9f9f9);
      --color-head-bg:  var(--tableHeadBackground, #000000);
      --font-body:      'Inter', sans-serif;
      --font-mono:      'JetBrains Mono', monospace;
    }

    /* ── Base ──────────────────────────────────────────────── */
    body {
      background: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-body);
    }

    /* ── Sidebar ───────────────────────────────────────────── */
    .sidebar {
      background: var(--color-sidebar);
      border-right: none;
    }

    .sidebar .app-name-link {
      display: block;
      text-align: center;
      padding: 20px 0 12px;
    }

    .sidebar .app-name-link img {
      width: 130px;
      display: block;
      margin: 0 auto;
    }

    .sidebar ul li a {
      color: #aaaaaa !important;
      font-size: 0.92rem;
      transition: color 0.2s;
    }

    .sidebar ul li a:hover,
    .sidebar ul li.active > a {
      color: #ffffff !important;
    }

    .sidebar ul li.active > a {
      font-weight: 600;
      border-right: 2px solid #ffffff;
    }

    .sidebar-nav li {
      color: #aaaaaa;
    }

    .sidebar-title {
      color: #ffffff;
      font-weight: 700;
      font-size: 1rem;
    }

    /* ── Setas do menu lateral ───────────────────────────── */
    .sidebar-nav ul:not(.app-sub-sidebar) > li:not(.file)::before {
      border-right-color: #ffffff !important;
      border-bottom-color: #ffffff !important;
    }

    /* ── Conteúdo principal ────────────────────────────────── */
    .content {
      background: var(--color-bg);
    }

    .markdown-section {
      max-width: 860px;
      color: var(--color-text);
      background: var(--color-surface);
      padding: 2rem 3rem;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    /* ── Títulos ───────────────────────────────────────────── */
    .markdown-section h1 {
      color: var(--color-accent);
      font-weight: 700;
      font-size: 2rem;
      border-bottom: 2px solid var(--color-accent);
      padding-bottom: 0.4em;
    }

    .markdown-section h2 {
      color: var(--color-accent);
      font-weight: 600;
      font-size: 1.4rem;
      border-bottom: 1px solid var(--color-border);
      padding-bottom: 0.3em;
    }

    .markdown-section h3 {
      color: var(--color-text);
      font-weight: 600;
      font-size: 1.05rem;
    }

    /* ── Links ─────────────────────────────────────────────── */
    .markdown-section a {
      color: var(--color-accent);
      text-decoration: underline;
      text-underline-offset: 3px;
      transition: opacity 0.2s;
    }

    .markdown-section a:hover {
      opacity: 0.6;
    }

    /* ── Tabelas ───────────────────────────────────────────── */
    .markdown-section table {
      border-collapse: collapse;
      width: 100%;
    }

    .markdown-section thead tr {
      background: var(--color-head-bg);
    }

    .markdown-section thead th {
      color: #ffffff;
      border: 1px solid var(--color-head-bg);
      padding: 10px 14px;
      font-weight: 600;
    }

    .markdown-section tbody tr:nth-child(odd) {
      background: var(--color-surface);
    }

    .markdown-section tbody tr:nth-child(even) {
      background: var(--color-stripe);
    }

    .markdown-section tbody td {
      border: 1px solid var(--color-border);
      padding: 9px 14px;
      color: var(--color-text);
    }

    /* ── Código inline ─────────────────────────────────────── */
    .markdown-section code {
      background: var(--color-code-bg);
      color: var(--color-accent);
      font-family: var(--font-mono);
      font-size: 0.88rem;
      padding: 2px 6px;
      border-radius: 3px;
    }

    /* ── Bloco de código ───────────────────────────────────── */
    .markdown-section pre {
      background: var(--color-code-bg) !important;
      border-left: 3px solid var(--color-accent);
      border-radius: 4px;
    }

    .markdown-section pre code {
      background: transparent;
      color: var(--color-text);
      font-family: var(--font-mono);
      font-size: 0.9rem;
      padding: 0;
    }

    /* ── Blockquote ────────────────────────────────────────── */
    .markdown-section blockquote {
      background: var(--color-stripe);
      border-left: 4px solid var(--color-accent);
      color: var(--color-muted);
      margin: 1.2em 0;
      padding: 12px 20px;
      border-radius: 0 4px 4px 0;
    }

    .markdown-section blockquote p {
      margin: 0;
    }

    /* ── Divisor ───────────────────────────────────────────── */
    .markdown-section hr {
      border: none;
      border-top: 1px solid var(--color-border);
      margin: 2em 0;
    }

    /* ── Barra de busca ────────────────────────────────────── */
    .search input {
      background: #3a3a3a !important;
      color: #ffffff !important;
      border: 1px solid #4a4a4a !important;
      border-radius: 4px !important;
    }

    .search input::placeholder {
      color: #aaaaaa !important;
    }

    .search .results-panel {
      background: #3a3a3a !important;
      border: 1px solid #4a4a4a !important;
    }

    .search .result-item a {
      color: #ffffff !important;
    }

    /* A busca fica na sidebar (sempre escura): cores fixas, independentes do tema */
    .sidebar .search .matching-post {
      border-bottom-color: #4a4a4a !important;
    }

    .sidebar .search .matching-post h2,
    .sidebar .search .matching-post a {
      color: #ffffff !important;
    }

    .sidebar .search .matching-post p,
    .sidebar .search .empty {
      color: #aaaaaa !important;
    }

    .sidebar .search .search-keyword {
      color: #ffffff !important;
      font-weight: 700;
    }

    .sidebar .search a:hover h2 {
      opacity: 0.7;
    }

    .sidebar .search .clear-button svg circle {
      fill: #6a6a6a;
    }

    /* ── Paginação ────────────────────────────────────────── */
    .docsify-pagination-container {
      max-width: 860px;
      margin: 1.5rem auto 0;
      border-top: 1px solid var(--color-border);
    }

    .docsify-pagination-container .pagination-item-label,
    .docsify-pagination-container .pagination-item-subtitle {
      color: var(--color-muted);
    }

    .docsify-pagination-container .pagination-item-title {
      color: var(--color-text);
    }

    /* ── Última atualização ───────────────────────────────── */
    .last-updated {
      margin-top: 2.5rem;
      font-size: 0.85rem;
      color: var(--color-muted);
    }

    .last-updated:empty {
      display: none;
    }

    /* ── Scrollbar ─────────────────────────────────────────── */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: var(--color-bg);
    }

    ::-webkit-scrollbar-thumb {
      background: #cccccc;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--color-accent);
    }
  </style>
</head>
<body>
  <div id="app">Carregando documentação da Shio...</div>
  <script>
    window.$docsify = {
      name: '<img src="assets/logo.png" alt="Shio" />',
      repo: '',
      homepage: 'gces-visao-geral.md',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      search: {
        maxAge: 0,
        paths: 'auto',
        placeholder: 'Pesquisar...',
        noData: 'Nenhum resultado encontrado!',
        depth: 6
      },
      nameLink: '/',
      pagination: {
        previousText: 'Anterior',
        nextText: 'Próxima',
        crossChapter: true,
        crossChapterText: true,
      },
      darklightTheme: {
        defaultTheme: 'light',
        siteFont: 'Inter',
        codeFontFamily: "'JetBrains Mono', monospace",
        bodyFontSize: '15px',
        light: {
          accent: '#000000',
          toogleBackground: '#2d2d2d',
          background: '#ffffff',
          pageBackground: '#f5f5f5',
          textColor: '#1a1a1a',
          mutedColor: '#666666',
          codeTextColor: '#1a1a1a',
          codeBackgroundColor: '#efefef',
          borderColor: 'rgba(0, 0, 0, 0.07)',
          tableBorder: '#e0e0e0',
          stripeColor: '#f9f9f9',
          tableHeadBackground: '#000000',
          sidebarSublink: '#aaaaaa',
          codeTypeColor: '#1a1a1a',
        },
        dark: {
          accent: '#ffffff',
          toogleBackground: '#ffffff',
          background: '#1e1e1e',
          pageBackground: '#121212',
          textColor: '#d4d4d4',
          mutedColor: '#9a9a9a',
          codeTextColor: '#e6e6e6',
          codeBackgroundColor: '#2a2a2a',
          borderColor: '#333333',
          tableBorder: '#3a3a3a',
          stripeColor: '#252525',
          tableHeadBackground: '#2d2d2d',
          sidebarSublink: '#aaaaaa',
          codeTypeColor: '#e6e6e6',
        },
      },
      plugins: [
        // Última atualização: data do último commit do .md da página, via API do GitHub.
        // Páginas ainda não commitadas (ou se a API falhar) simplesmente não mostram a data.
        function lastUpdated(hook, vm) {
          const repo = 'Shio-Enterprise/Documentacao';
          const cache = {};

          hook.afterEach(function (html, next) {
            next(html + '<p class="last-updated"></p>');
          });

          hook.doneEach(function () {
            const file = vm.route.file;
            const el = document.querySelector('.last-updated');
            if (!file || !el) return;

            const show = function (iso) {
              if (!iso) return;
              const date = new Date(iso).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
              el.textContent = 'Última atualização: ' + date;
              // Fica acima dos links Anterior/Próxima do docsify-pagination
              const pagination = document.querySelector('.docsify-pagination-container');
              if (pagination) pagination.parentNode.insertBefore(el, pagination);
            };

            if (file in cache) return show(cache[file]);

            const url = 'https://api.github.com/repos/' + repo + '/commits?per_page=1&path=docs/' + encodeURIComponent(file);
            fetch(url)
              .then(function (r) { return r.ok ? r.json() : []; })
              .then(function (commits) {
                cache[file] = commits.length ? commits[0].commit.committer.date : null;
                show(cache[file]);
              })
              .catch(function () {});
          });
        },
      ],
    }
  </script>

  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-darklight-theme@3.2.0/dist/index.min.js" type="text/javascript"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination@2.10.1/dist/docsify-pagination.min.js"></script>
</body>
</html>
